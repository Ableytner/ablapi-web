name: Build and push image

on:
  workflow_call:
    inputs:
      version_number:
        description: "Version of the image to build and push"
        required: false
        type: string
      push_image:
        description: "Whether to push the image to the registry"
        required: true
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  build-push:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: lowercase github.repository
      run: |
        echo "IMAGE_NAME=`echo ${{github.repository}} | tr '[:upper:]' '[:lower:]'`" >>${GITHUB_ENV}
    - name: Docker meta
      uses: docker/metadata-action@v6
      id: meta
      with:
        images: |
          ghcr.io/${{ env.IMAGE_NAME }}
        tags: |
          # always release image under 'dev' tag
          type=raw,value=dev
          # release under 'latest' tag if set
          type=raw,value=latest,enable=${{ inputs.version_number != '' }}
          # release under '<version_number>' tag if set
          type=raw,value=${{ inputs.version_number }},enable=${{ inputs.version_number != '' }}
        labels: |
          org.opencontainers.image.authors=Ableytner
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        pull: true
        push: ${{ inputs.push_image }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
